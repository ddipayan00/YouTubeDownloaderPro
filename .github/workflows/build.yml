# Builds a standalone app for every desktop OS.
#
# PyInstaller cannot cross-compile — a Windows .exe has to be produced on
# Windows, a macOS .app on macOS. So each target gets its own runner, and the
# matrix below is the whole reason this workflow exists. Push a v* tag and the
# results are attached to a GitHub release.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (x86_64)
            artifact: youtube-downloader-pro-linux-x86_64
          - os: windows-latest
            label: Windows (x64)
            artifact: youtube-downloader-pro-windows-x64
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: youtube-downloader-pro-macos-arm64
          - os: macos-13
            label: macOS (Intel)
            artifact: youtube-downloader-pro-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these to even open an offscreen display on a bare runner.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Fetch static ffmpeg
        run: python tools/fetch_ffmpeg.py

      - name: Build
        run: pyinstaller --noconfirm youtube-downloader-pro.spec

      # Confirm the frozen app starts and can see its own bundled ffmpeg,
      # rather than only confirming that PyInstaller exited zero.
      - name: Smoke-test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.artifact }}.tar.gz youtube-downloader-pro

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/youtube-downloader-pro -DestinationPath ${{ matrix.artifact }}.zip

      # ditto keeps the symlinks and permission bits inside a .app intact;
      # a plain zip corrupts the bundle.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/YouTube Downloader Pro.app" ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach builds to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
